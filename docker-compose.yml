version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: foodflow_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: foodflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: foodflow_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/foodflow_db
      - SECRET_KEY=foodflow-production-secret-2024
      - FLASK_ENV=production
    ports:
      - "5000:5000"

volumes:
  postgres_data:
