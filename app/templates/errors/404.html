{% extends 'base.html' %}

{% block title %}404 - Page Not Found - FoodFlow ERP{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-6 col-lg-5 text-center">
        <div class="mb-4">
            <div class="rounded-circle bg-warning-subtle text-warning d-inline-flex align-items-center justify-content-center mb-3" style="width: 72px; height: 72px;">
                <i data-lucide="file-question" style="width: 36px; height: 36px;"></i>
            </div>
            <h1 class="h3 fw-bold text-dark mb-2">404 - Page Not Found</h1>
            <p class="text-muted">The requested page or record could not be found. It may have been moved, renamed, or never existed.</p>
        </div>

        <div class="d-flex justify-content-center gap-2">
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary-custom btn-sm px-4">
                <i data-lucide="home" style="width: 16px; height: 16px; margin-right: 4px;"></i> Back to Workspace
            </a>
        </div>
    </div>
</div>
{% endblock %}
